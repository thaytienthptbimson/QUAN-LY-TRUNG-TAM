<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý trung tâm dạy thêm</title>
<meta name="theme-color" content="#0C566E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Bảng màu & token ============ */
:root{
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --bg:#EEF5F7; --card:#FFFFFF; --ink:#10222B; --ink2:#42606C; --mute:#76909B;
  --line:#DAE7EB; --line2:#BFD3DA; --th:#E6F1F4;
  --brand:#0F7A8C; --brand2:#19B7CB; --brand-d:#0A3F52; --brand-l:#E0F4F7;
  --glow1:rgba(25,183,203,.20); --glow2:rgba(245,158,11,.10);
  --glass:rgba(255,255,255,.80);
  --tot:#15803D; --tot-bg:#DCFCE7; --tot-c:#22A559;
  --kha:#1D4ED8; --kha-bg:#DBEAFE; --kha-c:#3B82F6;
  --tb:#A15207; --tb-bg:#FEF3C7; --tb-c:#F59E0B;
  --yeu:#B91C1C; --yeu-bg:#FEE2E2; --yeu-c:#EF4444;
  --tru-bg:#FFF5F5; --cong-bg:#F2FCF5;
  --shadow:0 1px 2px rgba(10,63,82,.06),0 10px 28px -12px rgba(10,63,82,.28);
  --shadow-s:0 1px 3px rgba(10,63,82,.14);
  --h1:36px;
}
[data-theme=dark]{
  --bg:#0D1A20; --card:#14262E; --ink:#E6F3F6; --ink2:#A9C4CD; --mute:#7F9CA7;
  --line:#254350; --line2:#34596A; --th:#1B3440;
  --brand:#4FD1E4; --brand2:#7BE0EE; --brand-d:#07202A; --brand-l:#173B47;
  --glow1:rgba(25,183,203,.22); --glow2:rgba(245,158,11,.07);
  --glass:rgba(20,38,46,.80);
  --tot:#6EE7A0; --tot-bg:#143B27; --kha:#93C5FD; --kha-bg:#172B57;
  --tb:#FCD34D; --tb-bg:#43300F; --yeu:#FCA5A5; --yeu-bg:#4A1B22;
  --tru-bg:#2A1D22; --cong-bg:#14302B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
  --shadow-s:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 8% -8%,var(--glow1),transparent 62%),radial-gradient(760px 480px at 100% 0%,var(--glow2),transparent 58%)}
h1,h2,h3,h4{margin:0;line-height:1.25}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(25,183,203,.55);outline-offset:2px}
.muted{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ Khung ứng dụng ============ */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:22px 16px;color:#fff;background:linear-gradient(185deg,#0A3F52 0%,#0C566E 55%,#0F7A8C 100%)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.2px}
.brand small{display:block;opacity:.75;font-size:12.5px}
.side nav{display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border:0;border-radius:14px;background:transparent;color:rgba(255,255,255,.82);font:600 14.5px var(--font);cursor:pointer;text-align:left;transition:background .15s}
.nav:hover{background:rgba(255,255,255,.1)}
.nav.on{background:#fff;color:var(--brand-d);box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .btn{justify-content:flex-start;background:rgba(255,255,255,.12);color:#fff}
.side-foot .btn:hover{background:rgba(255,255,255,.2)}
.main-col{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .ttl{font-size:20px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.topbar .meta{display:flex;gap:6px;flex-wrap:wrap;min-width:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;background:var(--brand-l);color:var(--brand);font:600 12.5px var(--font);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.saved{font:600 12px var(--font);color:var(--tot);opacity:0;transition:opacity .3s;white-space:nowrap}
.saved.show{opacity:1}
.main{padding:22px 28px 64px;max-width:1500px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-size:24px;font-weight:800;letter-spacing:-.4px}
.page-head p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.bottom-nav{display:none}

/* ============ Thành phần chung ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.card+.card,.stack>*+*{margin-top:16px}
.card h3{font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.card .sub{color:var(--ink2);font-size:13.5px;margin:2px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:12px;font:600 14px var(--font);cursor:pointer;background:var(--brand-l);color:var(--brand);transition:transform .12s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;box-shadow:0 10px 20px -10px rgba(15,122,140,.9)}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--ink)}
.btn.dng{background:var(--yeu-bg);color:var(--yeu)}
.btn.ok{background:var(--tot-bg);color:var(--tot)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--ink2);cursor:pointer}
.icon-btn:hover{background:var(--brand-l);color:var(--brand)}
.inp,select.inp,textarea.inp{font:500 15px var(--font);width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card);color:var(--ink)}
textarea.inp{resize:vertical;min-height:110px}
.inp:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 4px rgba(25,183,203,.2)}
label.f{display:flex;flex-direction:column;gap:5px;font:600 13px var(--font);color:var(--ink2)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:14px;background:var(--brand-l);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:10px;padding:0 14px;min-height:38px;font:600 13.5px var(--font);color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow-s)}
.badge{display:inline-flex;align-items:center;padding:1px 10px;border-radius:999px;font:700 12px/1.7 var(--font);white-space:nowrap}
.badge.tot{background:var(--tot-bg);color:var(--tot)}
.badge.kha{background:var(--kha-bg);color:var(--kha)}
.badge.tb{background:var(--tb-bg);color:var(--tb)}
.badge.yeu{background:var(--yeu-bg);color:var(--yeu)}
.badge.none{background:var(--th);color:var(--mute)}
.badge.warn{background:var(--tb-bg);color:var(--tb)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--ink2);font-size:13px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--mute)}
.empty{text-align:center;padding:42px 20px}
.empty .ill{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;display:grid;place-items:center;background:var(--brand-l);color:var(--brand)}
.empty .ill .ic{width:38px;height:38px}
.empty h3{font-size:20px;margin-bottom:6px}
.empty p{max-width:460px;margin:0 auto 18px;color:var(--ink2)}
.note{padding:10px 14px;border-radius:12px;background:var(--tb-bg);color:var(--tb);font-size:13.5px}
.note.info{background:var(--brand-l);color:var(--brand)}
.hint{font-size:13px;color:var(--mute)}

/* ============ Bảng ============ */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);max-height:calc(100dvh - 300px);min-height:160px;-webkit-overflow-scrolling:touch}
.table-wrap.free{max-height:none}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.grid th,.grid td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center;vertical-align:middle;background:var(--card)}
.grid th{background:var(--th);font-weight:700;color:var(--ink2);font-size:13px;position:sticky;top:0;z-index:3}
.grid td.l,.grid th.l{text-align:left}
.grid tbody tr:hover td{background:color-mix(in srgb,var(--brand-l) 55%,var(--card))}
.grid .c-stt{width:46px;min-width:46px;position:sticky;left:0;z-index:2;color:var(--mute)}
.grid .c-name{min-width:176px;max-width:240px;position:sticky;left:46px;z-index:2;text-align:left;box-shadow:6px 0 8px -6px rgba(10,63,82,.22);overflow:hidden;text-overflow:ellipsis}
.grid thead .c-stt,.grid thead .c-name{z-index:6}
.grid td.name b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.grid td.name small{display:flex;gap:6px;align-items:center;margin-top:1px}
.grid input.cell-in,.grid select.cell-in{font:500 13.5px var(--font);min-height:36px;padding:4px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);width:100%}
.grid input.cell-in:focus,.grid select.cell-in:focus{outline:none;border-color:var(--brand2)}
.pv{display:none}
.num-pos{color:var(--tot);font-weight:700}
.num-neg{color:var(--yeu);font-weight:700}
.tot-cell{font-weight:800;font-size:15px}
.mx thead tr.h1 th{top:0;height:var(--h1)}
.mx thead tr.h2 th{top:var(--h1);vertical-align:top;white-space:normal;min-width:84px;max-width:96px;line-height:1.25;padding:6px 6px}
.mx thead th.g-tru{background:var(--yeu-bg);color:var(--yeu)}
.mx thead th.g-cong{background:var(--tot-bg);color:var(--tot)}
.mx thead tr.h2 th.tru{background:color-mix(in srgb,var(--yeu-bg) 55%,var(--card))}
.mx thead tr.h2 th.cong{background:color-mix(in srgb,var(--tot-bg) 55%,var(--card))}
.mx th .cn{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;font-size:11.5px;color:var(--ink2);margin-top:2px}
.mx th .cp{display:block;font-weight:800;font-size:13px}
.mx th.tru .cp{color:var(--yeu)} .mx th.cong .cp{color:var(--tot)}
.mx td.cell{padding:4px 6px;min-width:84px}
.mx td.cell.tru{background:var(--tru-bg)}
.mx td.cell.cong{background:var(--cong-bg)}
.cellw{display:flex;align-items:center;justify-content:center;gap:5px}
.tk{width:36px;height:36px;border-radius:10px;border:2px solid var(--line2);background:var(--card);cursor:pointer;display:inline-grid;place-items:center;color:#fff;padding:0;transition:background .15s,border-color .15s}
.tk:hover{border-color:var(--brand2)}
.tk .ic{width:20px;height:20px;stroke-width:3;opacity:0}
.tk.on{border-color:transparent}
.tk.on .ic{opacity:1;animation:pop .24s ease-out}
.cell.tru .tk.on,.sw.tru.on,.crow.tru .tk.on{background:var(--yeu-c)}
.cell.cong .tk.on,.sw.cong.on,.crow.cong .tk.on{background:var(--tot-c)}
@keyframes pop{0%{transform:scale(.3)}65%{transform:scale(1.25)}100%{transform:scale(1)}}
.cnt{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 4px;border:0;border-radius:10px;background:rgba(80,60,180,.09);cursor:pointer;font:800 11.5px/1.15 var(--font);color:var(--ink)}
.cnt small{font-size:10.5px;font-weight:700}
.cnt.ed{box-shadow:inset 0 0 0 2px var(--brand2)}
.cnt.tru small{color:var(--yeu)} .cnt.cong small{color:var(--tot)}
.cnt.one{font-size:12px}

/* ============ Tuần: thanh chọn ============ */
.toolbar{display:flex;flex-direction:column;gap:12px}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.wk{flex:0 0 auto;scroll-snap-align:center;min-width:54px;min-height:54px;padding:4px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 16px var(--font);position:relative}
.wk small{font:500 10.5px var(--font);color:var(--mute);display:block;min-height:13px}
.wk.on{border-color:transparent;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 10px 18px -10px rgba(15,122,140,.9)}
.wk.on small{color:rgba(255,255,255,.85)}
.wk.done::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--tot-c)}
.wk.on.done::after{background:#fff}
.sumstrip{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sumstrip .st{display:flex;flex-direction:column;padding:8px 14px;border-radius:14px;background:var(--brand-l);min-width:92px}
.sumstrip .st small{font-size:12px;color:var(--ink2)}
.sumstrip .st b{font-size:19px;font-weight:800}
.lock{display:inline-flex;align-items:center;gap:6px}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.searchbar .inp{max-width:320px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2)}
.chk input{width:20px;height:20px;accent-color:var(--brand)}

/* ============ Thẻ học sinh (điện thoại) ============ */
.scard{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-s)}
.scard>button.hd{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 14px;border:0;background:transparent;text-align:left;cursor:pointer}
.scard .no{width:30px;color:var(--mute);font-weight:600;font-size:13px}
.scard .nm{flex:1;min-width:0;font-weight:600}
.scard .nm small{display:block;color:var(--mute);font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sc{font:800 19px var(--font);min-width:44px;text-align:right}
.scard .chev{transition:transform .2s;color:var(--mute)}
.scard.open .chev{transform:rotate(180deg)}
.scard .bd{display:none;border-top:1px solid var(--line)}
.scard.open .bd{display:block}
.sec-t{padding:10px 14px 4px;font:700 13px var(--font);color:var(--ink2)}
.crow{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--line);min-height:56px}
.crow .ct{flex:1;min-width:0;font-size:14px;line-height:1.35}
.crow .ct small{display:block;color:var(--mute);font-size:12px}
.crow.on{background:color-mix(in srgb,var(--brand-l) 50%,var(--card))}
.sw{position:relative;width:50px;height:30px;border-radius:999px;border:0;background:var(--line2);cursor:pointer;flex:0 0 auto;transition:background .18s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.sw.on::after{transform:translateX(20px)}
.step{display:inline-flex;align-items:center;background:var(--brand-l);border-radius:12px;flex:0 0 auto}
.step button{width:38px;height:38px;border:0;background:transparent;font:700 20px var(--font);color:var(--brand);cursor:pointer;border-radius:12px}
.step span,.step input{min-width:30px;text-align:center;font-weight:800}
.step input{width:56px;border:0;background:transparent;font:800 16px var(--font);color:var(--ink);height:38px}
input.pts{width:64px;min-height:38px;padding:4px 6px;border:1.5px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink);font:700 14px var(--font);text-align:center}
.adjrow{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:10px 14px 14px}
.cchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.cchip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font:600 13.5px var(--font)}
.cchip.tru b{color:var(--yeu)} .cchip.cong b{color:var(--tot)}
.cchip.on{background:var(--brand-l);border-color:var(--brand2)}
.crow2{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);min-height:56px}
.crow2 .no{width:30px;color:var(--mute);font-size:13px}
.crow2 .nm{flex:1;min-width:0;font-weight:600}
.crow2 .tk{width:44px;height:44px;border-radius:12px}

/* ============ Tổng quan ============ */
.dash{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.hero{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;background:linear-gradient(140deg,#0A3F52 0%,#0F7A8C 60%,#19B7CB 100%);color:#fff;border:0;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero h3{font-size:19px;font-weight:800}
.hero p{margin:4px 0 12px;opacity:.85;font-size:14px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.2)}
.ring .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ct b{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.ring .ct small{opacity:.85;font-size:13px;margin-top:4px}
.hero .btn.pri{background:#fff;color:var(--brand-d);box-shadow:none}
.hero .btn.ghost{border-color:rgba(255,255,255,.5);color:#fff}
.stackbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--th)}
.stackbar i{display:block;height:100%;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.c-tot{--c:var(--tot-c)} .c-kha{--c:var(--kha-c)} .c-tb{--c:var(--tb-c)} .c-yeu{--c:var(--yeu-c)}
.stackbar i.c-tot{background:var(--tot-c)} .stackbar i.c-kha{background:var(--kha-c)} .stackbar i.c-tb{background:var(--tb-c)} .stackbar i.c-yeu{background:var(--yeu-c)}
.list-s{list-style:none;margin:10px 0 0;padding:0}
.list-s li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.list-s li:first-child{border-top:0}
.list-s .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--brand-l);color:var(--brand);font:700 12px var(--font)}
.list-s .nm{flex:1;min-width:0;font-weight:600}
.list-s .nm small{display:block;font-weight:500;color:var(--mute);font-size:12.5px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* ============ Thống kê / biểu đồ ============ */
.donut-w{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;position:relative;flex:0 0 auto}
.donut svg{width:170px;height:170px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:22}
.donut .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .ct b{font-size:26px;font-weight:800;line-height:1}
.donut .ct small{color:var(--mute);font-size:12.5px}
.s-tot{stroke:var(--tot-c)} .s-kha{stroke:var(--kha-c)} .s-tb{stroke:var(--tb-c)} .s-yeu{stroke:var(--yeu-c)} .s-bg{stroke:var(--th)}
table.mini{border-collapse:collapse;font-size:14px;min-width:260px}
table.mini th,table.mini td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:center}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini th{color:var(--ink2);font-size:13px}
.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr 34px;gap:10px;align-items:center;margin:8px 0;font-size:13.5px}
.hb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .bar{height:14px;border-radius:999px;background:var(--th);overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.hb b{text-align:right}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--mute);font:500 11px var(--font)}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .dt{fill:var(--card);stroke:var(--brand);stroke-width:2.5}
.chart .ar{fill:var(--brand);opacity:.1}
.hkbars .rowb{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;margin:10px 0}
.hkbars .stackbar{height:26px}
.hkbars .stackbar i{display:flex;align-items:center;justify-content:center;color:#fff;font:700 11.5px var(--font)}

/* ============ Modal / Toast ============ */
#modal-root:not(.open){display:none}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,25,32,.58);backdrop-filter:blur(2px)}
.dlg{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--card);border-radius:24px;box-shadow:0 30px 70px -20px rgba(5,25,32,.6);animation:dlgin .22s ease-out}
.dlg.wide{width:min(860px,calc(100vw - 24px))}
@keyframes dlgin{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 4px 22px}
.dlg-h h3{font-size:18px;font-weight:800}
.dlg-b{padding:8px 22px 14px;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 22px 18px;border-top:1px solid var(--line)}
.dlg-f .btn.dng{margin-right:auto}
.dlg-b p{margin:6px 0 10px}
.rf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.step.lg{width:100%;justify-content:space-between}
.step.lg input{flex:1;width:auto}
#toasts{position:fixed;z-index:80;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:560px;padding:11px 16px;border-radius:14px;background:#0F3340;color:#fff;font-size:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:tin .22s ease-out}
.toast.err{background:#9F1D2C}
.toast.ok .ic{color:#6EE7A0}
.toast button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:5px 11px;font:700 13px var(--font);cursor:pointer}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ Danh sách học sinh / cài đặt ============ */
.tbl-edit td.l input{font:500 15px var(--font);width:100%;min-width:200px;min-height:40px;padding:4px 10px;border:1.5px solid transparent;border-radius:10px;background:transparent;color:var(--ink)}
.tbl-edit td.l input:hover{border-color:var(--line2)}
.tbl-edit td.l input:focus{outline:none;border-color:var(--brand2);background:var(--card)}
.imp-opts{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.imp-opts label{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px solid var(--line2);border-radius:12px;cursor:pointer;font-weight:600;font-size:14px}
.imp-opts input{accent-color:var(--brand)}
.sticky-sum{position:sticky;top:64px;z-index:10}
.set-sec+.set-sec{margin-top:16px}
.crit-t td,.crit-t th{padding:6px 8px}
.crit-t input[type=text],.crit-t input[type=number],.crit-t select{font:500 13.5px var(--font);width:100%;min-height:38px;padding:4px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.crit-t td.l{white-space:normal;min-width:240px}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list .btn{justify-content:flex-start;width:100%}

/* ============ Điện thoại / máy tính bảng nhỏ ============ */
@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:10px 14px}
  .topbar .meta{display:none}
  .topbar .ttl{flex:1;font-size:18px}
  .main{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
  .page-head h2{font-size:21px}
  .bottom-nav{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;border:0;background:transparent;color:var(--mute);font:600 11px var(--font);cursor:pointer;border-radius:14px}
  .bottom-nav button .ic{width:22px;height:22px}
  .bottom-nav button.on{color:var(--brand)}
  .bottom-nav button.on .ico{background:var(--brand-l)}
  .bottom-nav .ico{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .15s}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
  .dash{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .hero .row{justify-content:center}
  .table-wrap{max-height:calc(100dvh - 250px)}
  .card{padding:14px;border-radius:18px}
  .dlg{top:auto;bottom:0;left:0;transform:none;width:100%!important;max-height:92dvh;border-radius:24px 24px 0 0;animation:sheet .25s ease-out}
  @keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .dlg-f{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .rf{grid-template-columns:1fr}
  .donut-w{justify-content:center}
  .hb{grid-template-columns:minmax(90px,40%) 1fr 30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ In ấn ============ */
.print-only{display:none}
@media print{
  html,body{background:#fff!important;color:#000!important}
  body{font-size:11.5px}
  body::before{display:none}
  .side,.topbar,.bottom-nav,#toasts,#modal-root,.no-print,.btn,.seg,.chips,.toolbar,.searchbar,.page-head .row{display:none!important}
  .app{display:block}
  .main{padding:0;max-width:none}
  .print-only{display:block!important}
  .lock-scr,.lic-banner{display:none!important}
  .print-head{text-align:center;margin-bottom:10px;line-height:1.5}
  .print-head .t1{font-weight:700;text-transform:uppercase}
  .print-head .t2{font-size:15px;font-weight:800;margin:6px 0 2px;text-transform:uppercase}
  .print-sign{margin-top:26px;display:flex!important;justify-content:flex-end;text-align:center;page-break-inside:avoid}
  .print-sign div{min-width:240px}
  .print-sign b{display:block;text-transform:uppercase}
  .print-sign .sp{height:70px}
  .card{box-shadow:none;border:0;padding:0;background:#fff}
  .table-wrap{max-height:none!important;overflow:visible!important;border:0;border-radius:0}
  table.grid{font-size:11.5px}
  .grid th,.grid td{border:1px solid #555!important;padding:4px 6px;color:#000!important;background:#fff!important;position:static!important;box-shadow:none!important;white-space:normal}
  .grid th{background:#eee!important}
  thead{display:table-header-group}
  tr{page-break-inside:avoid}
  .badge{border:1px solid #777;background:#fff!important;color:#000!important;padding:0 6px}
  .grid input,.grid select,.grid .hide-print{display:none!important}
  .pv{display:inline!important}
  .num-pos,.num-neg{color:#000!important}
  .kpis,.two,.dash{display:block}
  .kpi{box-shadow:none;border:1px solid #999;margin-bottom:6px}
  .chart svg,.donut svg{max-width:100%}
  .hb .bar{border:1px solid #888}
  .hb .bar i{background:#555!important}
  a{color:#000;text-decoration:none}
  .page-head{display:none!important}
  .hint,.sub{color:#333!important}
  .main{padding:0 !important}
}

/* ---- bổ sung ---- */
.topbar .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.toast{max-width:calc(100vw - 24px)}
.row>.row,.row>.seg,.page-head>.row,.page-head>div{min-width:0;max-width:100%}
.two>.card+.card,.dash>.card+.card{margin-top:0}
.stackbar i{display:flex;align-items:center;justify-content:center;color:#fff;font:700 11.5px var(--font);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.searchbar .inp{width:260px;max-width:100%}
.crit-t input[type=number]{min-width:72px}
.crit-t td.l input[type=text]{min-width:270px}
.crit-t td:nth-child(8) input{min-width:210px}
.crit-t select{min-width:140px}
.crow{flex-wrap:wrap}
.crow .ctl{flex:0 0 100%;display:flex;align-items:center;gap:10px;padding:0 0 4px 62px;flex-wrap:wrap}
.step button:disabled{opacity:.3;cursor:not-allowed}
.crow2.tru .tk.on{background:var(--yeu-c)} .crow2.cong .tk.on{background:var(--tot-c)}
.crow2.crow{padding:8px 4px;flex-wrap:nowrap}
details summary{min-height:36px;display:flex;align-items:center}
@media print{.stackbar i,.donut circle,.hb .bar i,.chart .ar,.chart .ln{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (max-width:899px){
  .sumstrip{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .sumstrip .st{flex:0 0 auto;min-width:86px;padding:6px 12px}
  .sumstrip .st b{font-size:17px}
  .bottom-nav button{font-size:10.5px;white-space:nowrap;padding:0 2px}

}
.grid .reason{display:block;white-space:normal;max-width:300px;margin-top:2px;font-size:12px;line-height:1.35}
/* ---- bản quyền / khóa dùng thử ---- */
.lock-scr{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;background:linear-gradient(160deg,#0A3F52 0%,#0F7A8C 60%,#19B7CB 100%)}
body.locked .lock-scr{display:flex}
body.locked .app,body.locked .bottom-nav,body.locked #modal-root{display:none!important}
.lock-card{width:min(440px,100%);padding:30px 26px 22px;border-radius:28px;background:var(--card);color:var(--ink);text-align:center;box-shadow:0 40px 80px -30px rgba(0,0,0,.65)}
.lock-card .logo{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:var(--brand-l);color:var(--brand)}
.lock-card h1{margin:0 0 8px;font-size:23px;font-weight:800;letter-spacing:-.3px}
.lock-card>p{margin:0 0 16px;color:var(--ink2)}
.lock-msg,.lock-card .lock-msg{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--yeu-bg);color:var(--yeu);font-weight:600;text-align:left;line-height:1.5}
.lock-card .chk{justify-content:flex-start;margin:4px 0 10px;display:flex}
.lock-msg a{color:inherit;font-weight:800}
.lock-msg[hidden]{display:none}
.copyright{margin:30px 0 0;text-align:center;font-size:12.5px;color:var(--mute)}
.lock-card .copyright{margin-top:20px}
.side .copy{padding:4px 6px 0;font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.72)}
button.pill{border:0;cursor:pointer;font-family:var(--font)}
.pill.warn{background:var(--tb-bg);color:var(--tb)}
.lic-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.print-copy{margin-top:12px;text-align:center;font-size:10.5px;color:#555}

/* =================== QUẢN LÝ TRUNG TÂM: thành phần riêng =================== */
.tag{display:inline-flex;align-items:center;padding:1px 9px;margin:1px 3px 1px 0;border-radius:999px;font:600 12px/1.6 var(--font);color:var(--c,var(--brand));background:color-mix(in srgb,var(--c,var(--brand)) 13%,var(--card));border:1px solid color-mix(in srgb,var(--c,var(--brand)) 28%,transparent);white-space:nowrap}
.money{font-weight:700;font-variant-numeric:tabular-nums}
.owe{color:var(--yeu)} .paid{color:var(--tot)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:0 16px;min-height:46px;font:600 14px var(--font);color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolrow .inp{width:auto;min-width:150px;flex:0 1 220px}
.toolrow select.inp{flex:0 1 190px}
.monthnav{display:inline-flex;align-items:center;gap:6px}
.monthnav input[type=month]{width:auto;min-width:150px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ccard{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c,var(--brand));box-shadow:var(--shadow);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s}
.ccard:hover{transform:translateY(-2px)}
.ccard h3{font-size:17px}
.ccard .meta{display:flex;flex-direction:column;gap:3px;color:var(--ink2);font-size:13.5px}
.ccard .meta span{display:flex;gap:8px;align-items:flex-start}
.ccard .meta .ic{width:16px;height:16px;margin-top:3px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--th);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand))}
.infogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px}
.infogrid small{display:block;color:var(--mute);font-size:12.5px}
.infogrid b{font-weight:600}
.avatar{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font:800 24px var(--font);color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));flex:0 0 auto}
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.phead h2{font-size:23px;font-weight:800;letter-spacing:-.3px}
/* điểm danh */
.attrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.attrow .no{width:28px;color:var(--mute);font-size:13px}
.attrow .nm{flex:1 1 170px;min-width:0;font-weight:600}
.attrow .nm small{display:block;color:var(--mute);font-weight:500;font-size:12.5px}
.attb{display:inline-flex;gap:6px}
.ab{min-width:52px;height:46px;padding:0 8px;border-radius:12px;border:2px solid var(--line2);background:var(--card);font:700 13px var(--font);cursor:pointer;color:var(--ink2);line-height:1.1}
.ab small{display:block;font:500 10px var(--font)}
.ab.on.M{background:var(--tot-c);border-color:var(--tot-c);color:#fff}
.ab.on.T{background:var(--tb-c);border-color:var(--tb-c);color:#fff}
.ab.on.P{background:var(--kha-c);border-color:var(--kha-c);color:#fff}
.ab.on.K{background:var(--yeu-c);border-color:var(--yeu-c);color:#fff}
.attnote{flex:1 1 100%;display:flex;padding-left:38px}
.attnote input{font:500 13.5px var(--font);width:100%;max-width:420px;min-height:36px;padding:4px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.stt-M{color:var(--tot);font-weight:700}.stt-T{color:var(--tb);font-weight:700}.stt-P{color:var(--kha);font-weight:700}.stt-K{color:var(--yeu);font-weight:700}
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daynav input[type=date]{width:auto}
.cls-chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px}
.cls-chip{flex:0 0 auto;min-width:170px;text-align:left;border:1.5px solid var(--line);border-left:5px solid var(--c,var(--brand));border-radius:14px;background:var(--card);padding:9px 14px;cursor:pointer;font:inherit;color:inherit}
.cls-chip.on{background:var(--brand-l);border-color:var(--c,var(--brand2))}
.cls-chip b{display:block}.cls-chip small{color:var(--mute)}

.sched{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.sday{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:130px}
.sday h4{font-size:14px;margin-bottom:2px}.sday h4 small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.sday.today{border-color:var(--brand2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand2) 25%,transparent)}
.slot{display:block;width:100%;text-align:left;margin-top:8px;padding:7px 9px;border-radius:11px;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--card));font:inherit;font-size:12.5px;line-height:1.35;color:inherit;cursor:pointer}

.rcpt{font-family:'Times New Roman',serif;color:#000;line-height:1.6;font-size:14px;padding:6px 10px}
.rcpt .rc-h{display:flex;justify-content:space-between;gap:20px}
.rcpt h2{text-align:center;font-size:24px;margin:8px 0 4px;letter-spacing:1px}
.rcpt .amt{font-size:17px;font-weight:700}
.rcpt .sg{display:flex;justify-content:space-around;text-align:center;margin-top:12px}
.rcpt .sg div{min-width:180px}.rcpt .sg .sp{height:64px}
.rcpt .cp{margin-top:8px;text-align:center;font-size:10.5px;color:#555}
body.rcpt-mode .main,body.rcpt-mode .print-sign,body.rcpt-mode .print-copy{display:none!important}
.tbl-click tbody tr{cursor:pointer}
.sumline{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.legend-att{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.chk-list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:14px}
.chk-list label{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.chk-list input{width:20px;height:20px;accent-color:var(--brand)}
@media (max-width:899px){
  .sched{grid-template-columns:1fr}
  .sday{min-height:0}
  .toolrow .inp,.toolrow select.inp{flex:1 1 100%}
  .ab{min-width:48px}
}
@media print{
  .sched{display:block}.sday{break-inside:avoid;margin-bottom:8px;border:1px solid #888}
  .slot{background:#fff!important;border:1px solid #888;border-left:4px solid #000}
  .tag{background:#fff!important;color:#000!important;border:1px solid #777}
  .ccard,.tabs{display:none}
  body.rcpt-mode #printHead{display:block!important}
  .rcpt{padding:0 4mm}
}

/* ---- biểu đồ cột & hero tổng quan ---- */
.hero{grid-template-columns:minmax(0,1fr) auto}

<!-- Thư viện qua cdnjs: SheetJS đọc Excel, ExcelJS xuất Excel có định dạng -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" defer></script>
<script>
/*LOGIC_START*/
'use strict';
/* ==========================================================================
   PHẦN 1 - LÕI NGHIỆP VỤ (không đụng tới giao diện)
   Học viên - Lớp - Ghi danh - Điểm danh - Học phí/Công nợ - Lương giáo viên
   ========================================================================== */
const LS_KEY = 'tt-day-them-v1';
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const todayISO = () => isoOf(new Date());
const dowOf = iso => parseISO(iso).getDay();                 // 0 = Chủ nhật ... 6 = Thứ bảy
const kyOf = iso => String(iso).slice(0, 7);                  // 'YYYY-MM'
const addDaysISO = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const addMonthsKy = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const kyLabel = k => 'Tháng ' + (+k.slice(5)) + '/' + k.slice(0, 4);
const dmy = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const THU_ORDER = [1, 2, 3, 4, 5, 6, 0];
const thuShort = d => d === 0 ? 'CN' : 'T' + (d + 1);
const thuFull = d => d === 0 ? 'Chủ nhật' : 'Thứ ' + (d + 1);
const mondayOf = iso => addDaysISO(iso, -((dowOf(iso) + 6) % 7));
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const money = n => { const v = Math.round(+n || 0); return (v < 0 ? '−' : '') + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' đ'; };
const r1 = x => Math.round(x * 10) / 10;
const noDia = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
const norm = s => noDia(s).toLowerCase().replace(/\s+/g, ' ').trim();
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function deepMerge(base, over) {
  if (Array.isArray(base) || typeof base !== 'object' || base === null) return over === undefined ? base : over;
  const out = {};
  for (const k of Object.keys(base)) out[k] = (over && k in over) ? deepMerge(base[k], over[k]) : base[k];
  if (over && typeof over === 'object') for (const k of Object.keys(over)) if (!(k in out)) out[k] = over[k];
  return out;
}
function sortByGivenName(a, b) {
  const pa = a.ten.trim().split(/\s+/), pb = b.ten.trim().split(/\s+/);
  return pa[pa.length - 1].localeCompare(pb[pb.length - 1], 'vi') || a.ten.localeCompare(b.ten, 'vi');
}

/* ---- Đọc số tiền thành chữ (cho phiếu thu) ---- */
function docSo(n) {
  n = Math.round(Math.abs(+n || 0)); if (n === 0) return 'Không đồng';
  const ch = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  const ba = (x, full) => {
    const tr = Math.floor(x / 100), c = Math.floor((x % 100) / 10), dv = x % 10; let s = '';
    if (tr > 0 || full) s += ch[tr] + ' trăm';
    if (c > 1) { s += ' ' + ch[c] + ' mươi'; s += dv === 1 ? ' mốt' : dv === 4 ? ' tư' : dv === 5 ? ' lăm' : dv > 0 ? ' ' + ch[dv] : ''; }
    else if (c === 1) { s += ' mười'; s += dv === 5 ? ' lăm' : dv > 0 ? ' ' + ch[dv] : ''; }
    else if (dv > 0) { if (tr > 0 || full) s += ' lẻ'; s += ' ' + ch[dv]; }
    return s.trim();
  };
  const units = ['', 'nghìn', 'triệu', 'tỷ', 'nghìn tỷ', 'triệu tỷ'], g = [];
  while (n > 0) { g.push(n % 1000); n = Math.floor(n / 1000); }
  const parts = [];
  for (let i = g.length - 1; i >= 0; i--) if (g[i] > 0) parts.push((ba(g[i], i < g.length - 1) + ' ' + units[i]).trim());
  const t = parts.join(' ').replace(/\s+/g, ' ');
  return t.charAt(0).toUpperCase() + t.slice(1) + ' đồng';
}

/* ---- Cài đặt & trạng thái mặc định ---- */
function defaultSettings() {
  return {
    ten: '', diaChi: '', sdt: '', gv: '',
    mon: ['Toán', 'Ngữ văn', 'Tiếng Anh', 'Vật lý', 'Hóa học', 'Sinh học', 'Lịch sử', 'Địa lý', 'Tin học'],
    phong: ['Phòng 1', 'Phòng 2', 'Phòng 3'],
    tinhPhiVangCP: false,      // buổi vắng có phép có tính phí (với lớp thu theo buổi) hay không
    vangLienTiep: 3,           // cảnh báo khi vắng liên tiếp từ bấy nhiêu buổi
    theme: 'auto',
    nhacNo: 'Kính gửi phụ huynh em {ten}. {trungtam} xin thông báo học phí em còn thiếu là {no}. Kính mong phụ huynh sắp xếp thanh toán giúp trung tâm. Xin cảm ơn!'
  };
}
function newState() {
  return {
    v: 1, settings: defaultSettings(),
    students: [], teachers: [], classes: [], enroll: [],
    sessions: {}, charges: [], payments: [], expenses: [], tests: [], scores: {},
    counters: { pt: 0, ch: 0 },
    ui: { view: 'dash', sid: '', cid: '', q: '', fStatus: '', fClass: '', stTab: 'lop', clTab: 'hs', clKy: '', attDate: '', attCid: '',
          feeKy: '', feeOnly: false, feeQ: '', tchKy: '', repYear: '', repKy: '' }
  };
}
let S = null;

/* ---- Truy cập nhanh ---- */
const stuOf = id => S.students.find(s => s.id === id);
const clsOf = id => S.classes.find(c => c.id === id);
const tchOf = id => S.teachers.find(t => t.id === id);
const curKy = () => kyOf(todayISO());
const CLS_COLORS = ['#0F7A8C', '#E8590C', '#7048E8', '#2F9E44', '#D6336C', '#1971C2', '#E67700', '#099268'];
/* màu cố định theo lớp: chọn màu chưa dùng khi tạo lớp mới */
const nextColor = () => { const used = S.classes.map(c => c.mau); return CLS_COLORS.find(x => !used.includes(x)) || CLS_COLORS[S.classes.length % CLS_COLORS.length]; };
const clsColor = c => { if (!c) return CLS_COLORS[0]; let h = 0; for (const ch of c.id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return c.mau || CLS_COLORS[h % CLS_COLORS.length]; };

/* ---- Ghi danh ---- */
const enrActive = (e, iso) => e.tu <= iso && (!e.den || e.den >= iso);
const enrollsOfStu = sid => S.enroll.filter(e => e.sid === sid);
const enrollsOfClass = (cid, iso) => S.enroll.filter(e => e.cid === cid && (!iso || enrActive(e, iso)));
const activeClassesOf = (sid, iso) => enrollsOfStu(sid).filter(e => enrActive(e, iso || todayISO())).map(e => clsOf(e.cid)).filter(Boolean);

/* ---- Buổi học & điểm danh ---- */
// Trạng thái: M = có mặt, T = đi muộn, P = vắng có phép, K = vắng không phép
const ATT = { M: 'Có mặt', T: 'Đi muộn', P: 'Vắng có phép', K: 'Vắng không phép' };
const sessKey = (cid, date) => cid + '|' + date;
const getSess = (cid, date) => S.sessions[sessKey(cid, date)];
const sessIsDone = s => !!s && !s.off && (Object.keys(s.att || {}).length > 0 || (s.noiDung || '').trim() !== '');
function ensureSess(cid, date) {
  const k = sessKey(cid, date);
  if (!S.sessions[k]) S.sessions[k] = { cid, date, att: {}, note: {}, noiDung: '', btvn: '', gvId: '', off: false };
  return S.sessions[k];
}
/* Học viên của một buổi = ghi danh đang hiệu lực (đang học) + những em đã được điểm danh */
function rosterOf(cid, date) {
  const ids = [];
  S.enroll.forEach(e => { if (e.cid === cid && enrActive(e, date)) { const st = stuOf(e.sid); if (st && st.tt === 'dang' && !ids.includes(e.sid)) ids.push(e.sid); } });
  const s = getSess(cid, date); if (s) Object.keys(s.att || {}).forEach(id => { if (!ids.includes(id) && stuOf(id)) ids.push(id); });
  return ids.map(stuOf).sort(sortByGivenName);
}
const sessionsOf = (cid, ky) => Object.values(S.sessions).filter(s => s.cid === cid && (!ky || kyOf(s.date) === ky)).sort((a, b) => a.date.localeCompare(b.date));
function attStats(sid, cid, ky) {
  const r = { M: 0, T: 0, P: 0, K: 0, tong: 0 };
  Object.values(S.sessions).forEach(s => { if (s.off || (cid && s.cid !== cid) || (ky && kyOf(s.date) !== ky)) return; const st = (s.att || {})[sid]; if (st) { r[st]++; r.tong++; } });
  r.tyLe = r.tong ? Math.round((r.M + r.T) * 100 / r.tong) : null;
  return r;
}
function absentStreak(sid, cid) {
  const ss = Object.values(S.sessions).filter(s => s.cid === cid && !s.off && s.att && s.att[sid]).sort((a, b) => b.date.localeCompare(a.date));
  let n = 0; for (const s of ss) { if (s.att[sid] === 'K' || s.att[sid] === 'P') n++; else break; } return n;
}

/* ---- Lịch học ---- */
function lichText(c) {
  const g = {};
  (c.lich || []).forEach(l => { const k = l.bd + '–' + l.kt; (g[k] = g[k] || []).push(l.thu); });
  return Object.keys(g).map(k => g[k].slice().sort((a, b) => THU_ORDER.indexOf(a) - THU_ORDER.indexOf(b)).map(thuShort).join(', ') + ' · ' + k).join('; ') || 'Chưa xếp lịch';
}
function classesOnDate(iso) {
  const d = dowOf(iso);
  return S.classes.filter(c => c.tt !== 'ketthuc' && (c.lich || []).some(l => l.thu === d) && (!c.tu || c.tu <= iso) && (!c.den || c.den >= iso));
}
function slotOnDate(c, iso) { const d = dowOf(iso); return (c.lich || []).find(l => l.thu === d); }
function scheduleConflicts() {
  const slots = [];
  S.classes.filter(c => c.tt !== 'ketthuc').forEach(c => (c.lich || []).forEach(l => slots.push({ c, thu: l.thu, a: toMin(l.bd), b: toMin(l.kt) })));
  const out = [];
  for (let i = 0; i < slots.length; i++) for (let j = i + 1; j < slots.length; j++) {
    const x = slots[i], y = slots[j]; if (x.c.id === y.c.id || x.thu !== y.thu || !(x.a < y.b && y.a < x.b)) continue;
    if (x.c.phong && x.c.phong === y.c.phong) out.push({ c1: x.c, c2: y.c, thu: x.thu, why: 'phòng ' + x.c.phong });
    else if (x.c.gvId && x.c.gvId === y.c.gvId) out.push({ c1: x.c, c2: y.c, thu: x.thu, why: 'giáo viên ' + ((tchOf(x.c.gvId) || {}).ten || '') });
  }
  return out;
}

/* ---- Học phí ---- */
const COUNT_ST = () => S.settings.tinhPhiVangCP ? ['M', 'T', 'K', 'P'] : ['M', 'T', 'K'];
function billableSessions(sid, cid, ky) {
  const cs = COUNT_ST(); let n = 0;
  Object.values(S.sessions).forEach(s => { if (s.cid === cid && !s.off && kyOf(s.date) === ky && cs.includes((s.att || {})[sid])) n++; });
  return n;
}
/* Số tiền phải thu của một ghi danh trong một tháng. Trả về null nếu không phát sinh */
function chargeFor(e, ky) {
  const c = clsOf(e.cid), st = stuOf(e.sid); if (!c || !st || st.tt !== 'dang') return null;
  if (e.tu > ky + '-31' || (e.den && e.den < ky + '-01')) return null;
  let base = 0, txt = '';
  if (c.kieuPhi === 'thang') { base = +c.gia || 0; txt = `Học phí ${c.ten} - ${kyLabel(ky)}`; }
  else if (c.kieuPhi === 'khoa') { if (kyOf(e.tu) !== ky) return null; base = +c.gia || 0; txt = `Học phí trọn khóa ${c.ten}`; }
  else { const n = billableSessions(e.sid, e.cid, ky); if (!n) return null; base = n * (+c.gia || 0); txt = `Học phí ${c.ten} - ${kyLabel(ky)} (${n} buổi × ${money(c.gia)})`; }
  const amt = Math.max(0, Math.round(base * (1 - (+e.giamPct || 0) / 100) - (+e.giamTien || 0)));
  return { amount: amt, noiDung: txt, base };
}
/* Tạo / cập nhật công nợ học phí của một tháng (bỏ qua khoản GV đã sửa tay) */
function genCharges(ky) {
  let nNew = 0, nUpd = 0, nKeep = 0;
  S.enroll.forEach(e => {
    const r = chargeFor(e, ky); if (!r) return;
    const ex = S.charges.find(c => c.sid === e.sid && c.cid === e.cid && c.ky === ky && c.auto);
    if (ex) {
      if (ex.ed) { nKeep++; return; }
      if (ex.soTien !== r.amount || ex.noiDung !== r.noiDung) { ex.soTien = r.amount; ex.noiDung = r.noiDung; nUpd++; } else nKeep++;
    } else { S.charges.push({ id: uid(), n: ++S.counters.ch, sid: e.sid, cid: e.cid, ky, noiDung: r.noiDung, soTien: r.amount, auto: true }); nNew++; }
  });
  return { nNew, nUpd, nKeep };
}
/* Sổ công nợ một học viên: tiền đã thu được phân bổ vào khoản phải thu cũ nhất trước (FIFO) */
function ledgerOf(sid) {
  const ch = S.charges.filter(c => c.sid === sid).sort((a, b) => a.ky.localeCompare(b.ky) || (a.n || 0) - (b.n || 0));
  const thu = S.payments.filter(p => p.sid === sid).reduce((s, p) => s + (+p.soTien || 0), 0);
  let pool = thu - ch.reduce((s, c) => s + Math.min(0, +c.soTien || 0), 0);   // khoản giảm trừ (âm) cộng vào quỹ đã trả
  const rows = ch.map(c => {
    const a = +c.soTien || 0; let paid;
    if (a <= 0) paid = a; else { paid = Math.min(a, Math.max(pool, 0)); pool -= paid; }
    return Object.assign({}, c, { paid, remain: Math.max(0, a - paid) });
  });
  const tong = ch.reduce((s, c) => s + (+c.soTien || 0), 0);
  return { rows, tong, thu, no: Math.max(0, tong - thu), thua: Math.max(0, thu - tong) };
}
const totalDebt = () => S.students.reduce((s, st) => s + ledgerOf(st.id).no, 0);
/* Bảng công nợ theo tháng: mỗi học viên một dòng */
function feeMonth(ky) {
  const out = [];
  S.students.forEach(st => {
    const L = ledgerOf(st.id), rk = L.rows.filter(r => r.ky === ky), old = L.rows.filter(r => r.ky < ky);
    const phai = rk.reduce((s, r) => s + (+r.soTien || 0), 0), thu = rk.reduce((s, r) => s + r.paid, 0);
    const noCu = old.reduce((s, r) => s + r.remain, 0);
    if (!rk.length && noCu <= 0) return;
    out.push({ st, rows: rk, phai, thu, con: rk.reduce((s, r) => s + r.remain, 0), noCu, tongNo: L.no, thua: L.thua });
  });
  return out.sort((a, b) => sortByGivenName(a.st, b.st));
}
function reminderText(sid) {
  const st = stuOf(sid), L = ledgerOf(sid), c = S.settings;
  return (c.nhacNo || '').replace(/\{ten\}/g, st ? st.ten : '').replace(/\{no\}/g, money(L.no)).replace(/\{trungtam\}/g, c.ten || 'Trung tâm');
}

/* ---- Lương giáo viên: theo số buổi đã dạy ---- */
function teacherOfSession(s) { const c = clsOf(s.cid); return s.gvId || (c && c.gvId) || ''; }
function payrollOf(tid, ky) {
  const t = tchOf(tid); let n = 0;
  Object.values(S.sessions).forEach(s => { if (sessIsDone(s) && kyOf(s.date) === ky && teacherOfSession(s) === tid) n++; });
  const rate = t ? +t.luongBuoi || 0 : 0;
  return { soBuoi: n, donGia: rate, tien: n * rate };
}
const payrollTotal = ky => S.teachers.reduce((s, t) => s + payrollOf(t.id, ky).tien, 0);

/* ---- Thu chi & báo cáo ---- */
const sumBy = (arr, f, k) => arr.filter(f).reduce((s, x) => s + (+x[k] || 0), 0);
function monthReport(ky) {
  const thu = sumBy(S.payments, p => kyOf(p.ngay) === ky, 'soTien'), chi = sumBy(S.expenses, e => kyOf(e.ngay) === ky, 'soTien');
  const luong = payrollTotal(ky), phaiThu = sumBy(S.charges, c => c.ky === ky, 'soTien');
  return { ky, thu, chi, luong, phaiThu, loiNhuan: thu - chi - luong };
}
function classRevenue(ky) {
  return S.classes.map(c => {
    let phai = 0, thu = 0, con = 0;
    S.students.forEach(st => ledgerOf(st.id).rows.forEach(r => { if (r.cid === c.id && r.ky === ky) { phai += +r.soTien || 0; thu += r.paid; con += r.remain; } }));
    return { c, phai, thu, con };
  }).filter(r => r.phai || r.thu);
}

/* ---- Điểm kiểm tra ---- */
function avgScore(sid, cid) {
  let tot = 0, w = 0;
  S.tests.filter(t => t.cid === cid).forEach(t => { const v = (S.scores[t.id] || {})[sid]; if (v === undefined || v === null || v === '') return; const hs = +t.heso || 1; tot += (+v / (+t.thang || 10) * 10) * hs; w += hs; });
  return w ? r1(tot / w) : null;
}

/* ---- Đọc bảng tính danh sách học viên ---- */
const IMP_COLS = {

  if (!cand.length) { toast('Mọi học viên đang học đều đã có trong lớp này, hoặc chưa có học viên nào.', 'err'); return; }
  modal({ title: 'Thêm học viên vào ' + c.ten, wide: true, body: `<input class="inp" type="search" placeholder="Tìm học viên..." data-inp="enFilter" aria-label="Tìm học viên" style="margin-bottom:10px">
    <div class="chk-list" id="enList">${cand.map(s => `<label data-n="${esc(norm(s.ten))}"><input type="checkbox" value="${s.id}"><span><b>${esc(s.ten)}</b><br><small class="muted">${esc([s.lop, s.truong].filter(Boolean).join(' - '))}</small></span></label>`).join('')}</div>
    <div class="form-grid" style="margin-top:14px">${fi('Học từ ngày', 'enTu', t, 'date')}${fi('Giảm học phí (%)', 'enPct', 0, 'number', 'min="0" max="100" step="any"')}</div>`,
    actions: [{ label: 'Hủy', cls: 'ghost', fn: () => { } }, { label: 'Thêm vào lớp', cls: 'pri', fn: () => {
      const ids = $$('#enList input:checked').map(i => i.value); if (!ids.length) { toast('Hãy chọn ít nhất một học viên', 'err'); return false; }
      ids.forEach(sid => S.enroll.push({ id: uid(), sid, cid, tu: val('enTu') || t, den: '', giamPct: clamp(num(val('enPct')) || 0, 0, 100), giamTien: 0 }));

    actions: [{ label: 'Hủy', cls: 'ghost', fn: () => { } }, { label: id ? 'Lưu lớp' : 'Tạo lớp', cls: 'pri', fn: () => {

      const gia = num(val('cfGia')); if (gia === null || gia < 0) { toast('Hãy nhập mức học phí (số tiền)', 'err'); return false; }
      const o = { ten, mon: val('cfMon').trim(), khoi: val('cfKhoi').trim(), gvId: val('cfGv'), phong: val('cfPhong').trim(), max: Math.max(0, Math.round(num(val('cfMax')) || 0)), kieuPhi: val('cfKieu'), gia, tu: val('cfTu'), den: val('cfDen'), tt: val('cfTt'), lich };

    } }]

function openTestModal(id) {
  const t = id ? S.tests.find(x => x.id === id) : { ten: '', ngay: todayISO(), thang: 10, heso: 1 };
  modal({ title: id ? 'Sửa bài kiểm tra' : 'Thêm bài kiểm tra', body: `<div class="form-grid">${fi('Tên bài kiểm tra *', 'tfTen', t.ten, 'text', 'placeholder="Ví dụ: Kiểm tra 15 phút"')}${fi('Ngày', 'tfNgay', t.ngay, 'date')}${fi('Thang điểm', 'tfThang', t.thang, 'number', 'min="1"')}${fi('Hệ số', 'tfHeso', t.heso, 'number', 'min="1"')}</div>`,
    actions: [id ? { label: 'Xóa bài', cls: 'dng', fn: () => { undoable('Đã xóa bài kiểm tra', () => { S.tests = S.tests.filter(x => x.id !== id); delete S.scores[id]; }); } } : { label: 'Hủy', cls: 'ghost', fn: () => { } },
      { label: 'Lưu', cls: 'pri', fn: () => {
        const ten = val('tfTen').trim(); if (!ten) { toast('Hãy nhập tên bài kiểm tra', 'err'); return false; }
        const o = { ten, ngay: val('tfNgay') || todayISO(), thang: Math.max(1, num(val('tfThang')) || 10), heso: Math.max(1, num(val('tfHeso')) || 1) };
        if (id) Object.assign(t, o); else S.tests.push(Object.assign({ id: uid(), cid: S.ui.cid }, o)); save(); render();
      } }] });
}
ACT.addTest = () => openTestModal();

CHG.score = el => {
  const t = S.tests.find(x => x.id === el.dataset.tid), sid = el.dataset.sid, raw = el.value.trim();

    S.payments.push({ id: uid(), so: 'PT' + String(++S.counters.pt).padStart(4, '0'), sid: r.st.id, ngay: prev + '-' + pad(5 + (i % 8)), soTien: amount, ht: i % 3 === 0 ? 'ck' : 'tm', noiDung: 'Học phí ' + kyLabel(prev).toLowerCase(), nguoiNop: r.st.ph, nguoi: st.gv }); });
  feeMonth(curKy()).forEach((r, i) => { if (i % 3 !== 0 || r.phai <= 0) return; S.payments.push({ id: uid(), so: 'PT' + String(++S.counters.pt).padStart(4, '0'), sid: r.st.id, ngay: addDaysISO(today, -(1 + i % 3)), soTien: r.phai - r.noCu > 0 ? r.phai : r.phai, ht: 'tm', noiDung: 'Học phí ' + kyLabel(curKy()).toLowerCase(), nguoiNop: r.st.ph, nguoi: st.gv }); });
  S.expenses.push({ id: uid(), ngay: prev + '-02', loai: 'Thuê mặt bằng', noiDung: 'Tiền thuê mặt bằng', soTien: 5000000 }, { id: uid(), ngay: prev + '-10', loai: 'Điện nước', noiDung: 'Điện nước tháng', soTien: 1200000 }, { id: uid(), ngay: curKy() + '-02', loai: 'Văn phòng phẩm', noiDung: 'Giấy in, bút, phấn', soTien: 350000 });
  const tA = { id: uid(), cid: c1.id, ngay: addDaysISO(today, -21), ten: 'Kiểm tra 15 phút', thang: 10, heso: 1 }, tB = { id: uid(), cid: c1.id, ngay: addDaysISO(today, -7), ten: 'Kiểm tra giữa kỳ', thang: 10, heso: 2 };
  S.tests.push(tA, tB); S.scores[tA.id] = {}; S.scores[tB.id] = {}; enrollsOfClass(c1.id).forEach(e => { S.scores[tA.id][e.sid] = r1(5 + rnd() * 5); S.scores[tB.id][e.sid] = r1(4 + rnd() * 6); });
  S.ui.feeKy = curKy(); S.ui.attDate = today; save(); render(); toast('Đã nạp dữ liệu mẫu: 3 giáo viên, 4 lớp, 12 học viên, 7 tuần điểm danh');
}
ACT.demo = () => confirmBox('Nạp dữ liệu mẫu?', S.students.length || S.classes.length ? 'Toàn bộ dữ liệu hiện có sẽ bị thay bằng dữ liệu mẫu. Thông tin trung tâm được giữ nếu đã điền.' : 'App sẽ tạo giáo viên, lớp học, học viên, điểm danh và học phí mẫu để bạn dùng thử.', 'Nạp dữ liệu mẫu', loadDemo, !!(S.students.length || S.classes.length));

  <button class="btn" data-act="export">${ic('down')}Xuất file Excel</button><button class="btn" data-act="backup" data-close="1">${ic('file')}Sao lưu dữ liệu (JSON)</button><button class="btn" data-act="theme" data-close="1">${ic('sun')}Đổi giao diện sáng/tối</button><button class="btn" data-act="logout" data-close="1">${ic('lock')}Khóa / Đăng xuất</button></div>` });

/* ==========================  KHỞI TẠO  ========================== */
function init() {
  S = loadState(); S.ui.attDate = todayISO(); S.ui.attPick = false; applyTheme();
  document.addEventListener('click', e => {
    const m = e.target.closest('[data-mact]');
    if (m) { const a = MODAL.actions[+m.dataset.mact]; if (a) { const id = MODAL.id, r = a.fn(); if (r !== false && MODAL.id === id) closeModal(); } return; }
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (e.target.closest('a[href^="tel:"]')) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    if (el.tagName === 'A') e.preventDefault();
    const id = MODAL.id; fn(el, e);
    if (el.dataset.close && MODAL.id === id) closeModal();
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#modal-root').classList.contains('open')) closeModal();
    if (e.key === 'Enter' && e.target.matches && e.target.matches('.cell-in,.attnote input,.tbl-edit input')) e.target.blur();
  });
  $('#fileExcel').addEventListener('change', e => handleExcelFile(e.target.files[0]));
  $('#fileJson').addEventListener('change', e => handleJsonFile(e.target.files[0]));
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(() => { if (S.settings.theme === 'auto') applyTheme(); }); }
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  $('#lockCopy').textContent = COPYRIGHT; wireLicense();
  render();
}
document.addEventListener('DOMContentLoaded', init);
/* ==========================================================================
   PHẦN 6 - BẢN QUYỀN: DÙNG THỬ 30 NGÀY, SAU ĐÓ NHẬP MẬT KHẨU ĐỂ DÙNG TIẾP
   Lưu ý: đây là khóa phía trình duyệt, đủ để nhắc nhở và quản lý người dùng
   thông thường. Mật khẩu không nằm trong mã dưới dạng chữ rõ mà là mã băm SHA-256.
   ========================================================================== */
const COPYRIGHT = 'Bản quyền thuộc về Thầy Tiến - GV Trường THPT Bỉm Sơn- Thanh Hóa';
const CONTACT_HTML = 'Liên hệ Thầy Tiến - ĐT: <a href="tel:0943930787">0943930787</a> để lấy mã sử dụng.';
const TRIAL_DAYS = 30, DAY_MS = 86400000;
const PASS_HASH = 'f9c8f3a85e1aa86bdacae73ecad0fc6c13ba4102d8ed4152e6dc70c46877143f';
const LIC_KEYS = ['tt-day-them-lic-v1', 'ttd.cfg.b'];   // lưu 2 nơi để chống xóa nhầm một khóa
const SES_KEY = 'tt-day-them-ses-v1';
let SESSION_OK = false;

/* ---- SHA-256 thuần JS (không phụ thuộc crypto.subtle nên chạy cả khi mở file trực tiếp) ---- */
function sha256(ascii) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a)), mp = Math.pow, mw = mp(2, 32);
  const words = [], bitLen = ascii.length * 8; let result = '';
  let hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], pc = k.length; const comp = {};
  for (let cand = 2; pc < 64; cand++) {
    if (!comp[cand]) { for (let i = 0; i < 313; i += cand) comp[i] = cand; hash[pc] = (mp(cand, .5) * mw) | 0; k[pc++] = (mp(cand, 1 / 3) * mw) | 0; }
  }
  ascii += '\x80'; while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) { const j = ascii.charCodeAt(i); if (j >> 8) return ''; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = (bitLen / mw) | 0; words[words.length] = bitLen;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), old = hash; hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
        (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : '') + b.toString(16); }
  return result;
}
const hashPw = pw => sha256('SNN|' + unescape(encodeURIComponent(String(pw).trim())));
const ACT_TOKEN = sha256('OK|' + PASS_HASH);

/* ---- Bản ghi giấy phép: f = ngày bắt đầu dùng thử, l = thời điểm lớn nhất từng ghi nhận (chống lùi đồng hồ), a = đã kích hoạt ---- */
function licSave(rec) { const s = JSON.stringify(rec); LIC_KEYS.forEach(k => { try { localStorage.setItem(k, s); } catch (e) { /* bỏ qua */ } }); }
function licLoad() {
  const recs = [];
  LIC_KEYS.forEach(k => { try { const o = JSON.parse(localStorage.getItem(k)); if (o && typeof o === 'object') recs.push(o); } catch (e) { /* bỏ qua */ } });
  const now = Date.now(), last = recs.reduce((m, r) => Math.max(m, +r.l || 0), 0), eff = Math.max(now, last);
  let first = recs.length ? Math.min(...recs.map(r => +r.f || now)) : now;
  if (first > eff) first = eff;
  const rec = { f: first, l: eff, a: recs.some(r => r.a === ACT_TOKEN) ? ACT_TOKEN : '', rem: recs.some(r => r.rem === ACT_TOKEN) ? ACT_TOKEN : '' };
  if (recs.length < LIC_KEYS.length || eff - last > 60000) licSave(rec);
  return rec;
}
function isAuthed() {
  if (SESSION_OK) return true;
  try { if (sessionStorage.getItem(SES_KEY) === ACT_TOKEN) { SESSION_OK = true; return true; } } catch (e) { /* bỏ qua */ }
  const r = licLoad();
  if (r.rem === ACT_TOKEN) { SESSION_OK = true; return true; }
  return false;
}
function licStatus() {
  const r = licLoad();
  if (r.a === ACT_TOKEN) return { state: 'active' };
  const left = TRIAL_DAYS - Math.floor((r.l - r.f) / DAY_MS);
  return { state: left > 0 ? 'trial' : 'expired', left: Math.max(0, left), end: new Date(r.f + TRIAL_DAYS * DAY_MS) };
}
/* Trả về 'ok' | 'bad' | 'empty' */
function licTry(pw, rem) {
  if (!String(pw || '').trim()) return 'empty';
  if (hashPw(pw) !== PASS_HASH) return 'bad';
  SESSION_OK = true;
  try { sessionStorage.setItem(SES_KEY, ACT_TOKEN); } catch (e) { /* bỏ qua */ }
  const r = licLoad(); r.a = ACT_TOKEN;
  if (rem !== undefined) r.rem = rem ? ACT_TOKEN : '';
  licSave(r);
  return 'ok';
}
const licMsgHTML = r => r === 'empty' ? 'Vui lòng nhập mật khẩu.' : r === 'bad' ? `Mật khẩu chưa đúng.<br>${CONTACT_HTML}` : '';
const fmtDate = d => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();

/* ---- Khóa màn hình khi chưa đăng nhập hoặc hết hạn ---- */
function enforceLicense() {
  const locked = !isAuthed() || licStatus().state === 'expired', was = document.body.classList.contains('locked');
  document.body.classList.toggle('locked', locked);
  if (locked && !was) { const i = $('#lockPw'); if (i) setTimeout(() => i.focus(), 60); }
  return locked;
}
function wireLicense() {
  $('#lockForm').addEventListener('submit', e => {
    e.preventDefault();
    const inp = $('#lockPw'), msg = $('#lockMsg'), rem = $('#lockRem') && $('#lockRem').checked, r = licTry(inp.value, rem);
    if (r === 'ok') { inp.value = ''; msg.hidden = true; document.body.classList.remove('locked'); render(); toast('Đăng nhập thành công!'); return; }
    msg.hidden = false; msg.innerHTML = licMsgHTML(r); inp.select();
  });
  $('#lockShow').addEventListener('change', e => { $('#lockPw').type = e.target.checked ? 'text' : 'password'; });
  setInterval(() => { if (!document.body.classList.contains('locked')) enforceLicense(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) enforceLicense(); });
  const i = $('#lockPw'); if (i && document.body.classList.contains('locked')) setTimeout(() => i.focus(), 60);
}
ACT.logout = () => {
  SESSION_OK = false;
  try { sessionStorage.removeItem(SES_KEY); } catch (e) { /* bỏ qua */ }
  const r = licLoad(); r.rem = ''; licSave(r);
  enforceLicense();
  const i = $('#lockPw'), m = $('#lockMsg');
  if (m) m.hidden = true;
  if (i) { i.value = ''; setTimeout(() => i.focus(), 60); }
  toast('Đã khóa màn hình đăng nhập');
};

/* ---- Thành phần hiển thị ---- */
const copyrightHTML = () => `<footer class="copyright no-print">${esc(COPYRIGHT)}</footer>`;
function licPillHTML() {
  const st = licStatus(); if (st.state !== 'trial') return '';
  return `<button class="pill btn-pill ${st.left <= 7 ? 'warn' : ''}" data-act="licOpen" title="Nhập mật khẩu để kích hoạt">Dùng thử: còn ${st.left} ngày</button>`;
}
function licBannerHTML(view) {
  const st = licStatus(); if (st.state !== 'trial') return '';
  if (!(view === 'dash' || view === 'settings' || st.left <= 7)) return '';
  return `<div class="note ${st.left <= 7 ? '' : 'info'} no-print lic-banner"><span>Bản dùng thử: còn <b>${st.left} ngày</b> (hết hạn ngày ${fmtDate(st.end)}). Sau đó cần nhập mật khẩu để dùng tiếp, dữ liệu của bạn vẫn được giữ nguyên.</span><button class="btn sm pri" data-act="licOpen">Nhập mật khẩu</button></div>`;
}
function licCardHTML() {
  const st = licStatus();
  const head = st.state === 'active'
    ? `<p class="note info" style="margin-top:12px">Đã đăng nhập và kích hoạt bản quyền. Bạn được sử dụng không giới hạn thời gian.</p><div class="row" style="margin-top:12px"><button class="btn ghost" data-act="logout">${ic('lock')}Khóa màn hình / Đăng xuất</button></div>`
    : `<p class="note ${st.left <= 7 ? '' : 'info'}" style="margin-top:12px">Đang dùng thử: còn <b>${st.left} ngày</b> (hết hạn ngày ${fmtDate(st.end)}).</p>
    <div class="row" style="margin-top:12px"><label class="f grow" style="max-width:320px">Mật khẩu kích hoạt<input class="inp" id="licPwSet" type="password" autocomplete="off" placeholder="Nhập mật khẩu"></label><button class="btn pri" data-act="licActivateSet" style="align-self:flex-end">Kích hoạt</button><button class="btn ghost" data-act="logout" style="align-self:flex-end">${ic('lock')}Khóa màn hình</button></div>
    <p id="licMsgSet" class="lock-msg" role="alert" hidden></p>`;
  return `<div class="card"><h3>Bản quyền & bảo mật đăng nhập</h3><p class="sub">${esc(COPYRIGHT)}</p>${head}</div>`;
}
ACT.licOpen = () => modal({
  title: 'Kích hoạt bản quyền',
  body: `<p>Nhập mật khẩu để dùng không giới hạn thời gian sau khi hết 30 ngày dùng thử.</p>
    <label class="f">Mật khẩu<input class="inp" id="licPwModal" type="password" autocomplete="off" placeholder="Nhập mật khẩu"></label>
    <p id="licMsgModal" class="lock-msg" role="alert" hidden></p><p class="hint">${esc(COPYRIGHT)}</p>`,
  actions: [{ label: 'Để sau', cls: 'ghost', fn: () => { } }, { label: 'Kích hoạt', cls: 'pri', fn: () => {
    const r = licTry($('#licPwModal').value);
    if (r === 'ok') { render(); toast('Đã kích hoạt, cảm ơn bạn đã sử dụng!'); return; }
    const m = $('#licMsgModal'); m.hidden = false; m.innerHTML = licMsgHTML(r); return false;
  } }]
});
ACT.licActivateSet = () => {
  const r = licTry($('#licPwSet').value);
  if (r === 'ok') { render(); toast('Đã kích hoạt, cảm ơn bạn đã sử dụng!'); return; }
  const m = $('#licMsgSet'); m.hidden = false; m.innerHTML = licMsgHTML(r);
};
